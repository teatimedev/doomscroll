name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Player compiles on the oldest supported Python
        run: python -m py_compile bin/doomscrolld.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.287

      - name: Validate the plugin and the marketplace
        run: |
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate .

      - name: Run the mod's tests
        run: claude plugin test .
